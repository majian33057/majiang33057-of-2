<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>麻酱330五七的个人网页</title>
    <meta name="description" content="Re01 编程课的Flex布局演示。" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <meta name="msapplication-TileColor" content="#da532c" />
    <meta name="theme-color" content="#ffffff" />

    <style>
      body {
        margin: 0;
        height: 100vh;
        background-color: #eee;
      }
      .flex {
        display: flex;
      }
      .flex1 {
        flex: 1;
      }
      .column {
        flex-direction: column;
      }
      .yinYing {
        box-shadow: rgb(0 0 0 / 20%) 0px 2px 1px -1px,
          rgb(0 0 0 / 14%) 0px 1px 1px 0px, rgb(0 0 0 / 12%) 0px 1px 3px 0px;
      }
      .baiSe {
        background-color: #fff;
      }
      .mg8 {
        margin: 8px;
      }
      .mgr8 {
        margin-right: 8px;
      }
      .mgt8 {
        margin-top: 8px;
      }
      .shuJu {
        height: 100px;
      }
      .lieBiaoXiang {
        height: 160px;
      }
      .daoHang {
        padding: 10px 20px;
        border-bottom: 1px solid rgb(201, 201, 201);
        font-size: 14px;
        color: #666;
      }
      .neiRong::-webkit-scrollbar {
        display: none;
      }

      @media (max-width: 600px) {
        .ceBian {
          display: none;
        }
        .neiRong {
          flex-direction: column;
        }
        .shuJuQu {
          flex-direction: column;
        }
        .youQu {
          margin-left: 8px;
        }
        .shuJu {
          margin: 0 0 8px;
          flex: auto;
        }
      }
    </style>
  </head>
  <body class="flex">
    <!-- 侧边栏 -->
    <div
      style="width: 200px; z-index: 3"
      class="ceBian flex column baiSe yinYing"
    >
      <!-- 侧边头像栏 -->
      <div
        style="
          padding: 10px;
          align-items: center;
          justify-content: center;
          border-bottom: 1px solid #999;
        "
        class="flex"
      >
        <img
          alt="麻酱330五七的图片"
          src="https://img.remit.ee/api/file/BQACAgUAAyEGAASHRsPbAAEYnBNqc1H9NYIQm-Qy3FV_SUTd_f8RuwAC0TYAAniTmFeujDxIRrsuyT0E.png"
          width="40px"
          height="40px"
        />
        <div style="margin-left: 10px">麻酱330五七</div>
      </div>
      <!-- 导航栏 -->
      <div class="flex1">
        <div class="daoHang">此</div>
        <div class="daoHang">页</div>
        <div class="daoHang">面</div>
        <div class="daoHang">为</div>
        <div class="daoHang">下载</div>
        <div class="daoHang">区</div>
      </div>
    </div>
    <!-- 主区域 -->
    <div class="flex flex1 column">
      <!-- 头部栏 -->
      <div style="height: 60px; z-index: 2" class="baiSe yinYing"></div>
      <!-- 内容区 -->
      <div class="flex flex1 neiRong" style="overflow: auto">
        <!-- 左区 -->
        <div style="flex: 3" class="flex column mg8">
          <!-- 数据区 -->
          <div class="flex shuJuQu">
            <!-- 六个小块显示重点数据 -->
            <div class="shuJu baiSe yinYing flex1 mgr8">
              <img src="https://tse4-mm.cn.bing.net/th/id/OIP-C.F0mYzwjAynJ-Y0edakQNEQAAAA?w=115&h=120&c=7&r=0&o=7&dpr=2&pid=1.7&rm=3" alt="未知伤亡" width="75px" height="75px">
              <a href="https://store.steampowered.com/app/4576490/Casualties_Unknown?l=schinese">未知伤亡下载链接</a>
            </div>
            <div class="shuJu baiSe yinYing flex1 mgr8">
              <img src="https://tse3-mm.cn.bing.net/th/id/OIP-C.0-ZPrNPOQrOkNQ28K9ZpcAHaEL?w=287&h=180&c=7&r=0&o=7&dpr=2&pid=1.7&rm=3" alt="gunsaw" width="80px" height="75px">
              <a href="https://orsonik.itch.io/gunsaw-demo">gunsaw下载链接</a>
            </div>
            <div class="shuJu baiSe yinYing flex1 mgr8">
              <img src="https://tse4-mm.cn.bing.net/th/id/OIP-C.f0yZDcXs1ZhHRuLyrwgfQAHaDp?w=299&h=172&c=7&r=0&o=7&dpr=2&pid=1.7&rm=3" alt="PCL" width="75px" height="75px">
              <a href="https://afdian.com/p/0164034c016c11ebafcb52540025c377">PCL下载</a>
            </div>
            <div class="shuJu baiSe yinYing flex1 mgr8">
              <img src="https://tse4-mm.cn.bing.net/th/id/OIP-C.f86iHoKzvAGRgA83RA9CvwHaCO?w=311&h=104&c=7&r=0&o=7&dpr=2&pid=1.7&rm=3" alt="和平精英pc" width="75px" height="75px">
              <a href="https://gp.qq.com/gicp/news/684/18510156.html">和平精英电脑版下载</a>
            </div>
            <div class="shuJu baiSe yinYing flex1">
              <img src="https://tse1-mm.cn.bing.net/th/id/OIP-C.sJE956plOzjyDlutXsOSQQAAAA?w=132&h=180&c=7&r=0&o=7&dpr=2&pid=1.7&rm=3" alt="watt toolkit" width="80px" height="75px">
              <a href="https://apps.microsoft.com/detail/9mtcfhs560ng?launch=true&hl=zh-CN&gl=CN">watt toolkit下载</a>
            </div>
          </div>
          <!-- 列表区，列表数据可以无限增加 -->
          <div class="flex column">
            <!-- 列表项 -->
            <div class="lieBiaoXiang mgt8 baiSe yinYing"></div>
            <div class="lieBiaoXiang mgt8 baiSe yinYing"></div>
            <div class="lieBiaoXiang mgt8 baiSe yinYing"></div>
            <div class="lieBiaoXiang mgt8 baiSe yinYing"></div>
          </div>
        </div>
        <!-- 右区 -->
        <div style="flex: 1" class="youQu flex column mgr8 mgt8">
          <!-- 提示区 -->
          <div style="height: 150px" class="baiSe yinYing"></div>
          <div>
            <a href="https://majian33057.github.io/majiang33057/">前往第1页</a>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
